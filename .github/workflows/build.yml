name: Build Installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-build:
    name: Build (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: windows-2022
            host: windows
            arch: win64_msvc2022_64
          - os: ubuntu-24.04
            host: linux
            arch: linux_gcc_64
          - os: macos-15
            host: mac
            arch: clang_64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Set up Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          host: ${{ matrix.host }}
          target: desktop
          arch: ${{ matrix.arch }}
          cache: true

      - name: Test Go packages
        run: go test -count=1 ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Build Go targets on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -buildvcs=false -o oneproxy.exe ./cmd/oneproxy
          if ($LASTEXITCODE -ne 0) { throw "CLI build failed: $LASTEXITCODE" }
          go build -buildvcs=false -buildmode=c-shared -o oneproxy.dll ./cmd/oneproxy-dll
          if ($LASTEXITCODE -ne 0) { throw "Shared library build failed: $LASTEXITCODE" }

      - name: Build Go targets on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          go build -buildvcs=false -o oneproxy ./cmd/oneproxy
          go build -buildvcs=false -buildmode=c-shared -o liboneproxy.dylib ./cmd/oneproxy-dll

      - name: Build Go targets on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go build -buildvcs=false -o oneproxy ./cmd/oneproxy
          go build -buildvcs=false -buildmode=c-shared -o liboneproxy.so ./cmd/oneproxy-dll

      - name: Configure tray on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S trayapp -B trayapp/build -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DBUILD_TESTING=ON

      - name: Configure tray on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: cmake -S trayapp -B trayapp/build -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DBUILD_TESTING=ON

      - name: Build tray
        run: cmake --build trayapp/build --config Release

      - name: Test tray platform helpers
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir trayapp/build -C Release --output-on-failure

  windows-installer:
    name: Windows installer
    needs: platform-build
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Set up Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Download sing-box
        shell: pwsh
        run: |
          $version = '1.13.14'
          $archive = Join-Path $env:RUNNER_TEMP "sing-box-$version.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "sing-box-$version"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$version/sing-box-$version-windows-amd64.zip"
          $expectedHash = 'F580782C6DD10F7691C66CEA1D7C421813C5FBF7E305D1EE7CE0C3A40D196341'

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "sing-box archive hash mismatch: $actualHash"
          }

          Expand-Archive -Path $archive -DestinationPath $extractDir
          $singBox = Get-ChildItem $extractDir -Filter sing-box.exe -Recurse | Select-Object -First 1
          if (-not $singBox) { throw 'sing-box.exe not found in archive' }
          Copy-Item $singBox.FullName bin\sing-box.exe

      - name: Build Installer
        shell: pwsh
        run: .\build.ps1 -Installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OneProxy-Installer
          if-no-files-found: error
          path: dist/OneProxy-*.exe

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/OneProxy-*.exe
